<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MG BOT PRO - AI Trading Intelligence</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background-color: #090c15; color: #ffffff; padding: 15px; display: flex; justify-content: center; min-height: 100vh; align-items: flex-start; }
        
        .bot-container { 
            width: 100%; 
            max-width: 420px; 
            background: #0f1322; 
            border-radius: 24px; 
            padding: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border: 1px solid #1a2238;
            text-align: center;
        }
        
        /* প্রোফাইল এবং হেডার স্টাইলিং */
        .bot-avatar {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            margin: 10px auto 15px auto;
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.4);
        }
        .bot-avatar svg { width: 45px; height: 45px; fill: white; }
        .bot-title { font-size: 24px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; margin-bottom: 12px; text-transform: uppercase; }
        
        .stats-banner {
            background: #151b30;
            border-radius: 12px;
            padding: 10px;
            font-size: 13px;
            color: #94a3b8;
            border: 1px solid #222c4a;
            margin-bottom: 20px;
        }
        .stats-banner strong { color: #00e676; }
        .stats-banner span { color: #38bdf8; font-weight: bold; }

        /* কার্ড সেকশন */
        .section-card {
            background: #141a2e;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #1e2744;
            text-align: left;
        }
        .section-title { font-size: 14px; color: #00e676; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
        
        /* ব্রোকার প্ল্যাটফর্ম গ্রিড */
        .broker-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .broker-btn { 
            background: #1c233d; border: 1px solid #29355c; color: #cbd5e1; 
            padding: 14px 10px; border-radius: 12px; font-weight: 600; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; transition: 0.2s;
        }
        .broker-btn img { width: 18px; height: 18px; border-radius: 4px; }
        .broker-btn.active { 
            background: #6366f1; color: #fff; border-color: #818cf8; 
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); 
        }

        /* মার্কেট টাইপ বাটন */
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; background: #1c233d; border-radius: 12px; padding: 4px; border: 1px solid #29355c; }
        .market-btn { background: transparent; border: none; color: #94a3b8; padding: 10px; font-weight: 700; border-radius: 8px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .market-btn.active { background: #6366f1; color: #white; box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }

        /* ড্রপডাউন সিলেকশন */
        select { 
            width: 100%; background: #1c233d; border: 1px solid #29355c; color: #fff; 
            padding: 12px; border-radius: 12px; font-weight: 600; outline: none; font-size: 14px; 
        }

        /* AI সিগন্যাল ডিসপ্লে বক্স */
        .ai-display {
            background: linear-gradient(135deg, #151b30, #0d1222);
            border-radius: 16px; padding: 20px; text-align: center; margin-top: 15px;
            border: 1px solid #222c4a; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        .pulse-dot { width: 8px; height: 8px; background: #64748b; border-radius: 50%; display: inline-block; }
        .pulse-active { animation: pulse 1s infinite; background: #38bdf8; box-shadow: 0 0 10px #38bdf8; }
        
        .signal-text { font-size: 34px; font-weight: 900; margin: 10px 0; letter-spacing: 1px; }
        .neutral { color: #64748b; }
        .call-style { color: #00e676; text-shadow: 0 0 25px rgba(0,230,118,0.5); }
        .put-style { color: #ff3d00; text-shadow: 0 0 25px rgba(255,61,0,0.5); }

        /* প্রধান অ্যাকশন বাটন */
        .btn-main {
            width: 100%;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: #ffffff; border: none; padding: 15px; font-size: 16px; font-weight: 800;
            border-radius: 14px; cursor: pointer; margin-top: 15px; text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.3); transition: 0.2s;
        }
        .btn-main:disabled { background: #1e2744; color: #475569; cursor: not-allowed; box-shadow: none; }
        .btn-main:active { transform: scale(0.98); }

        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.4; } 100% { transform: scale(0.9); opacity: 1; } }
    </style>
</head>
<body>

<div class="bot-container">
    <!-- হেডার সেকশন -->
    <div class="bot-avatar">
        <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A2,2 0 0,1 14,6A2,2 0 0,1 12,8A2,2 0 0,1 10,6A2,2 0 0,1 12,4M12,18C8.69,18 6,15.31 6,12C6,10.96 6.26,9.97 6.74,9.11L8.35,11.83C8.12,12.37 8,12.96 8,13.5A4,4 0 0,0 12,17.5A4,4 0 0,0 16,13.5C16,12.96 15.88,12.37 15.65,11.83L17.26,9.11C17.74,9.97 18,10.96 18,12C18,15.31 15.31,18 12,18M12,10A1.5,1.5 0 0,1 13.5,11.5A1.5,1.5 0 0,1 12,13A1.5,1.5 0 0,1 10.5,11.5A1.5,1.5 0 0,1 12,10Z"/></svg>
    </div>
    <div class="bot-title">MG BOT PRO</div>
    <div class="stats-banner">📈 Signals: <span>286,427+</span> | Accuracy: <strong>96.8%</strong></div>

    <!-- প্ল্যাটফর্ম সেকশন -->
    <div class="section-card">
        <div class="section-title">⇄ Trading Platform</div>
        <div class="broker-grid">
            <button class="broker-btn active" onclick="selectBroker(this)">
                <img src="https://images.io" onerror="this.src='https://mixpanel.com';"> Quotex
            </button>
            <button class="broker-btn" onclick="selectBroker(this)">
                <img src="https://pocketoption.com"> Pocket Option
            </button>
            <button class="broker-btn" onclick="selectBroker(this)">
                <img src="https://binomo.com"> Binomo
            </button>
            <button class="broker-btn" onclick="selectBroker(this)">
                <img src="https://iqoption.com"> IQ Option
            </button>
        </div>
    </div>

    <!-- মার্কেট টাইপ -->
    <div class="section-card">
        <div class="section-title">📈 Market Type</div>
        <div class="market-grid">
            <button class="market-btn active" id="liveBtn" onclick="toggleMarket('LIVE')">LIVE</button>
            <button class="market-btn" id="otcBtn" onclick="toggleMarket('OTC')">OTC</button>
        </div>
    </div>

    <!-- কারেন্সি পেয়ার -->
    <div class="section-card">
        <div class="section-title">💵 Currency Pair</div>
        <select id="assetSelect">
            <option value="EUR/USD">EUR / USD (Euro / US Dollar)</option>
            <option value="GBP/USD">GBP / USD (British Pound)</option>
            <option value="USD/JPY">USD / JPY (US Dollar / Yen)</option>
            <option value="AUD/USD">AUD / USD (Australian Dollar)</option>
        </select>
    </div>

    <!-- AI ডিসপ্লে -->
    <div class="ai-display">
        <div style="font-size: 12px; color: #94a3b8; display: flex; justify-content: center; align-items: center; gap: 8px;">
            <span class="pulse-dot" id="loaderDot"></span>
            <span id="statusTxt">SYSTEM READY: CHOOSE OPTIONS</span>
        </div>
        <div id="signalTxt" class="signal-output neutral">READY</div>
        <div style="font-size: 11px; color: #64748b;" id="timerTxt">1M TIMEFRAME FILTER ACTIVE</div>
    </div>

    <!-- সিগন্যাল বাটন -->
    <button class="btn-main" id="generateBtn" onclick="generateAISignal()">⚡ GET AI SIGNAL (1M)</button>
</div>

<script>
    function selectBroker(btn) {
        let buttons = btn.parentElement.querySelectorAll('.broker-btn');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        resetDashboard();
    }

    function toggleMarket(mode) {
        let liveBtn = document.getElementById('liveBtn');
        let otcBtn = document.getElementById('otcBtn');
        let assetSelect = document.getElementById('assetSelect');

        if(mode === 'LIVE') {
            liveBtn.classList.add('active');
            otcBtn.classList.remove('active');
            assetSelect.innerHTML = `
                <option value="EUR/USD">EUR / USD (Real Market)</option>
                <option value="GBP/USD">GBP / USD (Real Market)</option>
                <option value="USD/JPY">USD / JPY (Real Market)</option>
            `;
        } else {
            otcBtn.classList.add('active');
            liveBtn.classList.remove('active');
            assetSelect.innerHTML = `
                <option value="EUR/USD_OTC">EUR / USD (OTC Asset)</option>
                <option value="GBP/USD_OTC">GBP / USD (OTC Asset)</option>
                <option value="BTC/USD_OTC">BTC / USD (OTC Crypto)</option>
            `;
        }
        resetDashboard();
    }

    function resetDashboard() {
        document.getElementById('statusTxt').innerText = "PROPERTIES UPDATED";
        document.getElementById('signalTxt').innerText = "READY";
        document.getElementById('signalTxt').className = "signal-output neutral";
