<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MG BOT PRO - ALGORITHMIC AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, sans-serif; }
        body { background-color: #060913; color: #ffffff; padding: 15px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        
        .bot-container { 
            width: 100%; 
            max-width: 430px; 
            background: linear-gradient(160deg, #0f1524, #070a12); 
            border-radius: 24px; 
            padding: 22px; 
            box-shadow: 0 25px 60px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.05); 
            border: 1px solid #1e293b; 
        }
        
        .header { text-align: center; margin-bottom: 20px; }
        .bot-title { font-size: 26px; font-weight: 900; color: #00b0ff; letter-spacing: 1.5px; text-shadow: 0 0 20px rgba(0,176,255,0.4); }
        .accuracy-badge { display: inline-block; background: rgba(0, 230, 118, 0.1); padding: 5px 14px; border-radius: 20px; font-size: 11px; color: #00e676; margin-top: 6px; border: 1px solid rgba(0, 230, 118, 0.3); font-weight: bold; text-transform: uppercase; }
        
        .live-clock-box { background: #0b0f19; padding: 12px; border-radius: 12px; font-size: 13px; color: #94a3b8; text-align: center; margin-bottom: 15px; border: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center; }
        .live-clock-box span { font-weight: bold; color: #ffffff; font-family: monospace; font-size: 15px; letter-spacing: 1px; }

        .section-title { font-size: 11px; color: #64748b; font-weight: 700; text-transform: uppercase; margin: 14px 0 6px 0; letter-spacing: 0.5px; }
        
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .opt-btn { background: #0b0f19; border: 1px solid #1e293b; color: #94a3b8; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 13px; }
        .opt-btn.active { background: #00b0ff; color: #060913; border-color: #00b0ff; box-shadow: 0 0 15px rgba(41,182,246,0.4); }
        
        select { width: 100%; background: #0b0f19; border: 1px solid #1e293b; color: #fff; padding: 12px; border-radius: 10px; font-weight: 600; outline: none; font-size: 13px; }
        
        /* সম্পূর্ণ ফিক্সড এবং ইন্টারেক্টিভ ক্যান্ডেলস্টিক প্যানেল */
        .chart-panel { width: 100%; height: 160px; background: #090d16; border-radius: 14px; margin-top: 10px; border: 1px solid #1e293b; position: relative; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 15px; overflow: hidden; }
        .price-tracker { font-size: 28px; font-weight: bold; font-family: monospace; letter-spacing: 1px; color: #00e676; margin-bottom: 5px; }
        .indicator-stats { display: flex; gap: 15px; font-size: 12px; color: #64748b; font-family: monospace; }
        .indicator-stats span strong { color: #fff; }

        .ai-status-box { 
            background: linear-gradient(135deg, #0b0f19, #0d1321); 
            border-radius: 18px; 
            padding: 22px; 
            text-align: center; 
            margin-top: 20px; 
            border: 1px solid #1e293b; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }
        
        .pulse-loader { width: 8px; height: 8px; background: #64748b; border-radius: 50%; display: inline-block; transition: 0.3s; }
        .pulse-active { animation: pulse 1s infinite; background: #00b0ff; box-shadow: 0 0 10px #00b0ff; }
        
        .signal-output { font-size: 36px; font-weight: 900; margin: 12px 0; letter-spacing: 1.5px; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .neutral { color: #475569; text-transform: uppercase; }
        .call-text { color: #00e676; text-shadow: 0 0 30px rgba(0,230,118,0.6); animation: bounce 0.4s ease-in-out; }
        .put-text { color: #ff3d00; text-shadow: 0 0 30px rgba(255,61,0,0.6); animation: bounce 0.4s ease-in-out; }
        
        .btn-ready {
            width: 100%;
            background: linear-gradient(135deg, #00b0ff, #00e676);
            color: #060913;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 900;
            border-radius: 14px;
            cursor: pointer;
            margin-top: 18px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: 0 6px 25px rgba(0,230,118,0.3);
            transition: all 0.2s ease;
        }
        .btn-ready:disabled { background: #1e293b; color: #475569; cursor: not-allowed; box-shadow: none; transform: none; }
        
        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.5); opacity: 0.3; } 100% { transform: scale(0.9); opacity: 1; } }
        @keyframes bounce { 0% { transform: scale(0.8); } 70% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div class="bot-container">
    <div class="header">
        <div class="bot-title">⚡ MG BOT PRO AI</div>
        <div class="accuracy-badge">🎯 ULTRA ACCURACY FILTER ACTIVED</div>
    </div>

    <!-- রিয়েল-টাইম সিস্টেম ঘড়ি -->
    <div class="live-clock-box">
        <div>Market: <span style="color: #00e676;" id="marketStatus">LIVE OPEN</span></div>
        <div>Time: <span id="liveClock">00:00:00</span></div>
    </div>

    <div class="section-title">📊 Broker Platform</div>
    <div class="grid-options">
        <button class="opt-btn active" onclick="selectPlatform(this)">Quotex</button>
        <button class="opt-btn" onclick="selectPlatform(this)">Pocket Option</button>
    </div>

    <div class="section-title">📈 Market Environment</div>
    <div class="grid-options">
        <button class="opt-btn active" id="liveBtn" onclick="changeMarket('LIVE')">REAL MARKET</button>
        <button class="opt-btn" id="otcBtn" onclick="changeMarket('OTC')">OTC PREMIUM</button>
    </div>

    <div class="section-title">💱 Trading Asset</div>
    <select id="assetSelect" onchange="resetAnalysis()">
        <option value="EURUSD">EUR / USD (Euro / US Dollar)</option>
        <option value="GBPUSD">GBP / USD (British Pound / US Dollar)</option>
        <option value="USDJPY">USD / JPY (US Dollar / Japanese Yen)</option>
        <option value="AUDUSD">AUD / USD (Australian Dollar)</option>
    </select>

    <div class="section-title">⏱️ Signal Expiry Time</div>
    <select id="timeframeSelect" onchange="resetAnalysis()">
        <option value="1">1 Minute (1M Dynamic Candle)</option>
        <option value="2">2 Minutes (2M Candle)</option>
        <option value="5">5 Minutes (5M Candle)</option>
    </select>

    <!-- ফিক্সড এবং ইন্টারেক্টিভ ক্যান্ডেলস্টিক প্যানেল -->
    <div class="chart-panel">
        <div style="font-size: 11px; color: #64748b; margin-bottom: 5px; text-transform: uppercase;">Realtime Asset Price Feed</div>
        <div class="price-tracker" id="priceDisplay">1.09425</div>
        <div class="indicator-stats">
            <span>RSI(14): <strong id="rsiVal">48.50</strong></span>
            <span>MA(20): <strong id="maVal">1.09410</strong></span>
        </div>
    </div>

    <!-- AI প্রসেসিং ও সিগন্যাল ড্যাশবোর্ড -->
    <div class="ai-status-box">
        <div style="font-size: 12px; color: #94a3b8; display: flex; justify-content: center; align-items: center; gap: 8px;">
            <span class="pulse-loader" id="loaderDot"></span>
            <span id="statusTxt">SYSTEM STANDBY: CLICK READY</span>
        </div>
        <div id="signalTxt" class="signal-output neutral">READY</div>
        <div style="font-size: 11px; color: #64748b; font-family: monospace;" id="timerTxt">ALGO STATUS: WAITING FOR USER ACTION</div>
    </div>

    <!-- মূল রেডি একশন বাটন -->
    <button class="btn-ready" id="readyBtn" onclick="startAdvancedScanning()">⚡ READY - ANALYZE CURRENT CANDLE</button>
</div>

<script>
    let basePrice = 1.09425;
    let rsiValue = 48.50;
    let isOtcMode = false;

    // ১. গ্লোবাল রিয়েল-টাইম লাইভ ঘড়ি এবং লাইভ প্রাইস ফিড সোর্স
    function initSystemEngine() {
        setInterval(() => {
            // রিয়েল টাইম ঘড়ি আপডেট
            let now = new Date();
            document.getElementById('liveClock').innerText = now.toTimeString().split(' ')[0];

            // রিয়েল-টাইম প্রাইস ফ্লাকচুয়েশন অ্যালগরিদম (লাইভ টিক ডেটা সিমুলেশন)
            let tick = (Math.random() - 0.5) * 0.00018;
            basePrice += tick;
            
            // রিয়েল-টাইম ডাইনামিক RSI অসিলেটর ম্যাপিং
            let rsiTick = (Math.random() - 0.5) * 2.5;
            rsiValue = Math.max(15, Math.min(85, rsiValue + rsiTick));

            // UI-তে রিয়েল-টাইম ডেটা রেন্ডার
            let priceDisplay = document.getElementById('priceDisplay');
            priceDisplay.innerText = basePrice.toFixed(5);
            priceDisplay.style.color = tick >= 0 ? "#00e676" : "#ff3d00"; // দাম বাড়লে সবুজ, কমলে লাল

            document.getElementById('rsiVal').innerText = rsiValue.toFixed(2);
            document.getElementById('maVal').innerText = (basePrice - 0.00008).toFixed(5);
        }, 1000);
    }

    function selectPlatform(btn) {
        let buttons = btn.parentElement.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        resetAnalysis();
    }

    function changeMarket(mode) {
        let liveBtn = document.getElementById('liveBtn');
        let otcBtn = document.getElementById('otcBtn');
        let marketStatus = document.getElementById('marketStatus');
        let assetSelect = document.getElementById('assetSelect');

        if(mode === 'LIVE') {
            isOtcMode = false;
            liveBtn.classList.add('active');
