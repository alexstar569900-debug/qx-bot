<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QX PRO Android Bot</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #0d1622;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .bot-card {
            width: 100%;
            max-width: 400px;
            background: #172437;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #25354e;
            text-align: center;
        }
        h2 {
            color: #00e676;
            font-size: 22px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .subtitle {
            color: #7f92a9;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .signal-box {
            background: #1f3049;
            border-radius: 12px;
            padding: 25px 15px;
            margin-bottom: 20px;
            border: 2px solid #2d4263;
            transition: all 0.3s ease;
        }
        .signal-label {
            font-size: 11px;
            color: #9cb1cc;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .signal-output {
            font-size: 30px;
            font-weight: 900;
            margin: 10px 0;
            letter-spacing: 1px;
        }
        .neutral { color: #b0bec5; }
        .call-bg { color: #00e676; text-shadow: 0 0 15px rgba(0,230,118,0.4); }
        .put-bg { color: #ff3d00; text-shadow: 0 0 15px rgba(255,61,0,0.4); }
        
        .market-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .data-item {
            background: #1f3049;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #2a3d59;
        }
        .data-item span {
            display: block;
            font-size: 11px;
            color: #7f92a9;
            margin-bottom: 4px;
        }
        .data-item strong {
            font-size: 16px;
            color: #ffffff;
        }
        .btn-action {
            width: 100%;
            background: linear-gradient(135deg, #00e676, #00b0ff);
            color: #0d1622;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease;
            box-shadow: 0 4px 15px rgba(0,230,118,0.2);
        }
        .btn-action:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

<div class="bot-card">
    <h2>QX SIGNAL BOT</h2>
    <div class="subtitle">🔴 LIVE MARKET ANALYZER (MOBILE OPTIMIZED)</div>

    <div class="signal-box" id="sigCard">
        <div class="signal-label">AI SIGNALS GENERATION</div>
        <div id="sigTxt" class="signal-output neutral">ANALYZING...</div>
        <div style="font-size: 11px; color: #7f92a9;" id="expiryTxt">EXPIRY: 1 MIN</div>
    </div>

    <div class="market-data">
        <div class="data-item">
            <span>OTC ASSET PRICE</span>
            <strong id="priceTxt">$1.09420</strong>
        </div>
        <div class="data-item">
            <span>RSI OSCILLATOR</span>
            <strong id="rsiTxt">50.00</strong>
        </div>
    </div>

    <button class="btn-action" onclick="forceSignal()">⚡ INSTANT GENERATE</button>
</div>

<script>
    let basePrice = 1.09420;
    
    // লাইভ মার্কেট সিমুলেশন লজিক
    function updateMarket() {
        // প্রাইস ওঠানামা
        let change = (Math.random() - 0.5) * 0.00040;
        basePrice += change;
        document.getElementById('priceTxt').innerText = '$' + basePrice.toFixed(5);

        // RSI ক্যালকুলেশন সিমুলেশন
        let randomRSI = Math.floor(Math.random() * (85 - 15 + 1)) + 15;
        document.getElementById('rsiTxt').innerText = randomRSI.toFixed(2);

        // রিয়েলটাইম ইন্ডিকেটর ভিত্তিক অটো সিগন্যাল
        let sigTxt = document.getElementById('sigTxt');
        if (randomRSI >= 70) {
            sigTxt.innerText = "⬇️ PUT (SELL)";
            sigTxt.className = "signal-output put-bg";
        } else if (randomRSI <= 30) {
            sigTxt.innerText = "⬆️ CALL (BUY)";
            sigTxt.className = "signal-output call-bg";
        } else {
            sigTxt.innerText = "⏱️ HOLD MARKET";
            sigTxt.className = "signal-output neutral";
        }
    }

    // ম্যানুয়াল সিগন্যাল বাটন ফাংশন
    function forceSignal() {
        let sigTxt = document.getElementById('sigTxt');
        sigTxt.innerText = "GENERATING...";
        sigTxt.className = "signal-output neutral";
        
        setTimeout(() => {
            let options = ["⬆️ CALL (BUY)", "⬇️ PUT (SELL)"];
            let randomSig = options[Math.floor(Math.random() * options.length)];
            sigTxt.innerText = randomSig;
            if(randomSig.includes("CALL")) {
                sigTxt.className = "signal-output call-bg";
            } else {
                sigTxt.className = "signal-output put-bg";
            }
        }, 800);
    }

    // প্রতি ৪ সেকেন্ড পর পর মার্কেট আপডেট হবে
    setInterval(updateMarket, 4000);
</script>

</body>
</html>
