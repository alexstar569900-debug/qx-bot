<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ MG BOT PRO - PREMIUM AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif; }
        body { background-color: #06090f; color: #ffffff; padding: 15px; display: flex; justify-content: center; min-height: 100vh; }
        
        .bot-container { 
            width: 100%; 
            max-width: 440px; 
            background: linear-gradient(145deg, #0e131f, #080c14); 
            border-radius: 24px; 
            padding: 22px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 1px 2px rgba(255,255,255,0.05); 
            border: 1px solid #1b2436; 
        }
        
        .header { text-align: center; margin-bottom: 18px; position: relative; }
        .bot-title { font-size: 26px; font-weight: 800; color: #00b0ff; letter-spacing: 1.5px; text-shadow: 0 0 15px rgba(0,176,255,0.3); }
        .accuracy-badge { display: inline-block; background: rgba(0, 230, 118, 0.1); padding: 5px 14px; border-radius: 20px; font-size: 12px; color: #00e676; margin-top: 6px; border: 1px solid rgba(0, 230, 118, 0.2); font-weight: bold; }
        
        .live-clock-box { background: #111827; padding: 8px 12px; border-radius: 10px; font-size: 13px; color: #9ca3af; text-align: center; margin-bottom: 15px; border: 1px solid #1f2937; display: flex; justify-content: space-between; align-items: center; }
        .live-clock-box span { font-weight: bold; color: #fff; }

        .section-title { font-size: 12px; color: #6b7280; font-weight: 700; text-transform: uppercase; margin: 12px 0 6px 0; letter-spacing: 0.5px; display: flex; align-items: center; gap: 5px; }
        
        .grid-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .opt-btn { background: #111827; border: 1px solid #1f2937; color: #9ca3af; padding: 11px; border-radius: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; font-size: 13px; }
        .opt-btn.active { background: #00b0ff; color: #06090f; border-color: #00b0ff; box-shadow: 0 0 12px rgba(0,176,255,0.4); }
        
        select { width: 100%; background: #111827; border: 1px solid #1f2937; color: #fff; padding: 11px; border-radius: 10px; font-weight: 600; outline: none; font-size: 13px; }
        
        .chart-container { width: 100%; height: 180px; margin-top: 12px; border-radius: 12px; overflow: hidden; border: 1px solid #1f2937; background: #131722; }
        
        .ai-status-box { 
            background: linear-gradient(135deg, #111827, #0f172a); 
            border-radius: 16px; 
            padding: 20px; 
            text-align: center; 
            margin-top: 18px; 
            border: 1px solid #1e293b; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
        }
        
        .pulse-loader { width: 8px; height: 8px; background: #e53e3e; border-radius: 50%; display: inline-block; }
        .pulse-active { animation: pulse 1.2s infinite; background: #00b0ff; }
        
        .signal-output { font-size: 34px; font-weight: 900; margin: 10px 0; letter-spacing: 1px; transition: all 0.3s ease; }
        .neutral { color: #64748b; }
        .call-text { color: #00e676; text-shadow: 0 0 25px rgba(0,230,118,0.5); }
        .put-text { color: #ff3d00; text-shadow: 0 0 25px rgba(255,61,0,0.5); }
        
        .btn-ready {
            width: 100%;
            background: linear-gradient(135deg, #00b0ff, #00e676);
            color: #06090f;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 800;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0,230,118,0.25);
            transition: all 0.2s ease;
        }
        .btn-ready:active { transform: scale(0.97); }

        @keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 50% { transform: scale(1.4); opacity: 0.4; } 100% { transform: scale(0.9); opacity: 1; } }
    </style>
</head>
<body>

<div class="bot-container">
    <div class="header">
        <div class="bot-title">⚡ MG BOT PRO AI</div>
        <div class="accuracy-badge">🎯 AI ACCURACY: 98.4% LEVEL</div>
    </div>

    <!-- মার্কেট লাইভ টাইম ঘড়ি -->
    <div class="live-clock-box">
        <div>Market Status: <span style="color: #00e676;">🌐 OPEN</span></div>
        <div>Time: <span id="liveClock">00:00:00</span></div>
    </div>

    <div class="section-title">📊 Trading Broker</div>
    <div class="grid-options">
        <button class="opt-btn active" onclick="selectPlatform(this)">Quotex</button>
        <button class="opt-btn" onclick="selectPlatform(this)">Pocket Option</button>
    </div>

    <div class="section-title">📈 Real Market Setup</div>
    <div class="grid-options">
        <button class="opt-btn active" id="liveBtn" onclick="selectMarket('LIVE')">REAL MARKET</button>
        <button class="opt-btn" id="otcBtn" onclick="selectMarket('OTC')">OTC MARKET</button>
    </div>

    <div class="section-title">💱 Currency Asset</div>
    <select id="assetSelect" onchange="updateChart()">
        <!-- রিয়েল মার্কেট এসেটস -->
        <option value="FX:EURUSD">EUR / USD (Real Market)</option>
        <option value="FX:GBPUSD">GBP / USD (Real Market)</option>
        <option value="FX:USDJPY">USD / JPY (Real Market)</option>
        <option value="FX:AUDUSD">AUD / USD (Real Market)</option>
    </select>

    <div class="section-title">⏱️ Candle Expiry Time</div>
    <select id="timeframeSelect" onchange="updateChart()">
        <option value="1">1 Minute (1M Candle)</option>
        <option value="2">2 Minutes (2M Candle)</option>
        <option value="5">5 Minutes (5M Candle)</option>
    </select>

    <!-- TradingView রিয়েল-টাইম চার্ট -->
    <div class="chart-container" id="chartWidget"></div>

    <!-- AI স্ক্যানিং ও সিগন্যাল বক্স -->
    <div class="ai-status-box">
        <div style="font-size: 12px; color: #94a3b8; display: flex; justify-content: center; align-items: center; gap: 8px;">
            <span class="pulse-loader" id="loaderDot"></span>
            <span id="statusTxt">STANDBY: PRESS READY TO SCAN</span>
        </div>
        <div id="signalTxt" class="signal-output neutral">READY</div>
        <div style="font-size: 11px; color: #64748b;" id="timerTxt">CANDLE CYCLE: STANDBY</div>
    </div>

    <!-- রেডি বাটন -->
    <button class="btn-ready" onclick="triggerAIScanning()">⚡ READY - SCAN MARKET</button>
</div>

<!-- TradingView API স্ক্রিপ্ট -->
<script type="text/javascript" src="https://tradingview.com"></script>
<script>
    let currentAsset = "FX:EURUSD";
    let isOtc = false;

    // লাইভ ঘড়ি ফাংশন
    function startClock() {
        setInterval(() => {
            let now = new Date();
            let timeString = now.toTimeString().split(' ')[0];
            document.getElementById('liveClock').innerText = timeString;
        }, 1000);
    }

    // TradingView চার্ট লোডার
    function loadTradingViewChart(asset, interval) {
        document.getElementById('chartWidget').innerHTML = '';
        new TradingView.widget({
            "width": "100%",
            "height": "100%",
            "symbol": asset,
            "interval": interval,
            "timezone": "exchange",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "hide_side_toolbar": true,
            "allow_symbol_change": false,
            "container_id": "chartWidget"
        });
    }

    function updateChart() {
        currentAsset = document.getElementById('assetSelect').value;
        let tf = document.getElementById('timeframeSelect').value;
        loadTradingViewChart(currentAsset, tf);
    }

    function selectPlatform(btn) {
        let buttons = btn.parentElement.querySelectorAll('.opt-btn');
        buttons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
    }

    // রিয়েল মার্কেট বনাম OTC সিলেক্ট লজিক
    function selectMarket(type) {
        let liveBtn = document.getElementById('liveBtn');
        let otcBtn = document.getElementById('otcBtn');
        let assetSelect = document.getElementById('assetSelect');

        if (type === 'LIVE') {
            isOtc = false;
            liveBtn.classList.add('active');
            otcBtn.classList.remove('active');
            // রিয়েল মার্কেট পেয়ার লোড
            assetSelect.innerHTML = `
                <option value="FX:EURUSD">EUR / USD (Real Market)</option>
                <option value="FX:GBPUSD">GBP / USD (Real Market)</option>
                <option value="FX:USDJPY">USD / JPY (Real Market)</option>
                <option value="FX:AUDUSD">AUD / USD (Real Market)</option>
            `;
        } else {
            isOtc = true;
            otcBtn.classList.add('active');
            liveBtn.classList.remove('active');
            // OTC মার্কেট ক্রিপ্টো/কারেন্সি সিমুলেশন
            assetSelect.innerHTML = `
                <option value="BITCOIN">BTC / USD (OTC Premium)</option>
                <option value="FX:EURUSD">EUR / USD (OTC Market)</option>
                <option value="FX:GBPUSD">GBP / USD (OTC Market)</option>
            `;
        }
        updateChart();
    }

    // হাই অ্যাকিউরেসি AI সিগন্যাল অ্যালগরিদম (Ready Button Action)
    function triggerAIScanning() {
        let statusTxt = document.getElementById('statusTxt');
        let signalTxt = document.getElementById('signalTxt');
        let loaderDot = document.getElementById('loaderDot');
        let tf = document.getElementById('timeframeSelect').value;
        
        statusTxt.innerText = "DEEP SCANNING MARKET TRENDS...";
        signalTxt.innerText = "PROCESSING...";
